<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SolShield</title>
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        font-family: Inter, system-ui, sans-serif;
        background: #0e1526;
        color: #e2e8f0;
      }
      .row { display: flex; align-items: center; gap: 10px; }
      .logo { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, #22d3ee, #8b5cf6); }
      h1 { font-size: 15px; margin: 0; }
      label { display: block; font-size: 12px; color: #94a3b8; margin: 16px 0 6px; }
      input { width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); background: rgba(0,0,0,0.3); color: #e2e8f0; font-size: 13px; }
      button { width: 100%; margin-top: 12px; padding: 9px; border-radius: 8px; border: none; background: linear-gradient(90deg, #22d3ee, #8b5cf6); color: #070b16; font-weight: 700; cursor: pointer; }
      .status { font-size: 12px; margin-top: 10px; color: #34d399; min-height: 16px; }
      .note { font-size: 11px; color: #64748b; margin-top: 14px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="logo"></div>
      <h1>SolShield</h1>
    </div>
    <label for="api">Scanner backend URL</label>
    <input id="api" type="text" placeholder="http://localhost:8787" />
    <button id="save">Save</button>
    <div class="status" id="status"></div>
    <p class="note">
      SolShield intercepts Solana signing requests and scans them before they reach your
      wallet. It never sees your keys. Point this at your SolShield backend.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
