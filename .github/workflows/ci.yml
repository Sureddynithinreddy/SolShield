name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shared:
    name: shared (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  backend:
    name: backend (typecheck + test)
    runs-on: ubuntu-latest
    needs: shared
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # shared is imported via the @shared tsconfig path, so install it too.
      - run: npm install --prefix ../shared
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  frontend:
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    needs: shared
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix ../shared
      - run: npm install
      - run: npm run build

  extension:
    name: extension (typecheck + build)
    runs-on: ubuntu-latest
    needs: shared
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix ../shared
      - run: npm install
      - run: npm run build
