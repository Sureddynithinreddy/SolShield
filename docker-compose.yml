# Local full-stack run: MongoDB + backend + frontend.
#   docker compose up --build
# Then: frontend http://localhost:8080, backend http://localhost:8787
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      MONGODB_URI: "mongodb://mongo:27017"
      MONGODB_DB: "solshield"
      CORS_ORIGINS: "http://localhost:8080"
      # SOLANA_RPC_URLS: "https://your-rpc"   # optional, defaults to public mainnet
    depends_on:
      - mongo

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: "http://localhost:8787"
        VITE_SOLANA_CLUSTER: "mainnet-beta"
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo-data:
